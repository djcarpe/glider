[package]
name = "glider-bench"
description = "Benchmark harness for glider: LDBC-style graph generator and HTTP load generator."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Same rule as glider itself: std only. The harness must not drag in crates the
# thing under test refuses to use.
[dependencies]

[lints]
workspace = true

[[bin]]
name = "ldbc-gen"
path = "src/bin/ldbc-gen.rs"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"
