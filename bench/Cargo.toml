[package]
name = "glider-bench"
description = "Benchmark harness for glider: LDBC-style graph generator and HTTP load generator."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Same rule as glider itself: std only. The harness must not drag in crates the
# thing under test refuses to use. glider itself is the one exception: the
# stress generator writes its file format directly.
[dependencies]
glider = { path = ".." }

[lints]
workspace = true

[lib]
name = "glider_bench"
path = "src/lib.rs"

[[bin]]
name = "mfg-gen"
path = "src/bin/mfg-gen.rs"

[[bin]]
name = "mfg-bench"
path = "src/bin/mfg-bench.rs"

[[bin]]
name = "ldbc-gen"
path = "src/bin/ldbc-gen.rs"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"

[[bin]]
name = "stress-gen"
path = "src/bin/stress-gen.rs"

[[bin]]
name = "scale-gen"
path = "src/bin/scale-gen.rs"

[[bin]]
name = "pagebench"
path = "src/bin/pagebench.rs"

[[bin]]
name = "ctxbench"
path = "src/bin/ctxbench.rs"

[[bin]]
name = "hotbench"
path = "src/bin/hotbench.rs"

[[bin]]
name = "memprobe"
path = "src/bin/memprobe.rs"

[[bin]]
name = "algobench"
path = "src/bin/algobench.rs"
